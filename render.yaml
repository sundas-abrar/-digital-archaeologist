services:
  - type: web
    name: digital-archaeologist-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOWED_ORIGINS
        sync: false
    # Note: free tier doesn't support persistent disks, so uploaded
    # session data in backend/storage/ won't survive a redeploy or a
    # free-tier spin-down/restart. Fine for demo use (upload -> analyze
    # -> download report in one sitting). Add a paid instance + disk
    # later if sessions need to persist longer.
